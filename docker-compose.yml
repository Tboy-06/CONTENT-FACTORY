version: "3.8"

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: content-factory-postiz
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postiz:postiz@postgres:5432/postiz
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - postgres
      - redis
    volumes:
      - postiz_data:/app/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: content-factory-postgres
    environment:
      - POSTGRES_USER=postiz
      - POSTGRES_PASSWORD=postiz
      - POSTGRES_DB=postiz
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: content-factory-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postiz_data:
  postgres_data:
  redis_data: