<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const savedTheme = localStorage.getItem("cf_studio_theme");
        const savedScheme = localStorage.getItem("color-scheme");
        const resolvedScheme =
          savedScheme ??
          (savedTheme === "dark-glass" || savedTheme === "classic-dark"
            ? "dark"
            : savedTheme === "light-glass"
            ? "light"
            : "light dark");
        const meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.content = resolvedScheme;
        if (savedTheme) document.documentElement.dataset.studioMode = savedTheme;
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Content Factory - Video Production Pipeline</title>
    <meta name="description" content="Local and cloud video production studio. Script planning, voiceover synthesis, kinetic subtitles, and multi-format rendering." />
    <meta property="og:title" content="Content Factory - Video Production Pipeline" />
    <meta property="og:description" content="Local and cloud video production studio. Script planning, voiceover synthesis, kinetic subtitles, and multi-format rendering." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
